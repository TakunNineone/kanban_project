<style>
    .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #64748b;
    }
</style>

<div x-show="taskDetailsModal && selectedTask"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
     x-cloak>

    <!-- Карточка модалки с защитой от кликов по подложке во время просмотра картинок -->
    <div class="bg-white rounded-2xl max-w-4xl w-full shadow-2xl overflow-hidden flex flex-col"
         style="height: 85vh; max-height: 85vh;"
         @click.outside="if (!imagePreviewModal) taskDetailsModal = false">

        <!-- 1. ШАПКА -->
        <div class="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
            <div class="flex items-center gap-2 flex-1">
                <span class="text-xs font-bold px-2 py-1 rounded text-white shrink-0"
                      :class="getPriorityBadgeClass(selectedTask?.priority)">
                    Приоритет <span x-text="selectedTask?.priority"></span>
                </span>

                <button type="button" @click="toggleFollow()"
                        class="px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 border transition shrink-0"
                        :class="selectedTask?.is_following ? 'bg-blue-50 text-blue-700 border-blue-300' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'">
                    <span x-text="selectedTask?.is_following ? '👁️ Вы следите' : '🔔 Следить'"></span>
                    <span class="text-[10px] bg-gray-200 text-gray-700 px-1 rounded-full"
                          x-text="selectedTask?.followers_count || 0"></span>
                </button>

                <input type="text" x-model="selectedTask.name" :disabled="!isTaskCreator"
                       class="font-bold text-lg text-gray-800 border-none bg-transparent focus:ring-2 focus:ring-blue-500 rounded px-2 w-full">
            </div>
            <button type="button" @click="taskDetailsModal = false"
                    class="text-gray-400 hover:text-gray-700 text-xl font-bold ml-4 shrink-0">✖</button>
        </div>

        <!-- 2. ВКЛАДКИ -->
        <div class="flex border-b bg-gray-100 text-sm font-semibold shrink-0">
            <button type="button" @click="activeTaskTab = 'details'" class="py-2.5 px-4 border-b-2"
                    :class="activeTaskTab === 'details' ? 'border-blue-600 text-blue-600 bg-white' : 'text-gray-600'">⚙️ Детали</button>
            <button type="button" @click="activeTaskTab = 'checklist'" class="py-2.5 px-4 border-b-2"
                    :class="activeTaskTab === 'checklist' ? 'border-blue-600 text-blue-600 bg-white' : 'text-gray-600'">
                ☑️ Чек-лист (<span x-text="checklistItems.length"></span>)
            </button>
            <button type="button" @click="activeTaskTab = 'comments'" class="py-2.5 px-4 border-b-2"
                    :class="activeTaskTab === 'comments' ? 'border-blue-600 text-blue-600 bg-white' : 'text-gray-600'">
                💬 Комментарии (<span x-text="comments.length"></span>)
            </button>
            <button type="button" @click="activeTaskTab = 'history'" class="py-2.5 px-4 border-b-2"
                    :class="activeTaskTab === 'history' ? 'border-blue-600 text-blue-600 bg-white' : 'text-gray-600'">📜 История</button>
        </div>

        <!-- 3. ОБЛАСТЬ КОНТЕНТА -->
        <div class="p-6 flex-1 min-h-0 overflow-hidden">

            <!-- ВКЛАДКА: ДЕТАЛИ -->
            <div x-show="activeTaskTab === 'details'"
                 class="space-y-4 custom-scrollbar"
                 style="height: calc(85vh - 230px); overflow-y: auto; padding-right: 0.5rem;">

                <div class="p-2.5 bg-blue-50/50 border border-blue-100 rounded-xl text-xs text-gray-600 flex flex-wrap items-center gap-4">
                    <div>🆔 <b>ID:</b> <span class="text-gray-800 font-mono font-bold" x-text="selectedTask?.formatted_id || '—'"></span></div>
                    <div>👤 <b>Создатель:</b> <span class="text-gray-800 font-bold" x-text="selectedTask?.created_by || 'Неизвестно'"></span></div>
                    <div>📅 <b>Дата создания:</b> <span class="text-gray-800 font-medium" x-text="formatDate(selectedTask?.date)"></span></div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Описание</label>
                    <textarea rows="4" x-model="selectedTask.description" :disabled="!isTaskCreator"
                              @paste="handlePaste($event, 'task')"
                              @keydown.ctrl.enter="saveTask()"
                              placeholder="Введите описание..."
                              class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 border-gray-300"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Критичность / Приоритет</label>
                        <select x-model="selectedTask.priority" :disabled="!isTaskCreator"
                                class="w-full border rounded-lg p-2 text-sm border-gray-300 font-semibold">
                            <option value="1">🟢 Низкий</option>
                            <option value="2">🟡 Средний</option>
                            <option value="3">🟠 Высокий</option>
                            <option value="4">🔴 Критический</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Ответственный</label>
                        <select x-model="selectedTask.assigned_to"
                                class="w-full border rounded-lg p-2 text-sm">
                            <option value="">Не назначен</option>
                            <template x-for="u in users" :key="u.id">
                                <option :value="u.id" x-text="u.username"></option>
                            </template>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Соисполнители</label>
                        <select x-model="selectedTask.co_executors" multiple :disabled="!isTaskCreator"
                                class="w-full border rounded-lg p-1 text-sm h-20">
                            <template x-for="u in users" :key="u.id">
                                <option :value="u.id" x-text="u.username"></option>
                            </template>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Дедлайн</label>
                        <input type="date" x-model="selectedTask.deadline" :disabled="!isTaskCreator"
                               class="w-full border rounded-lg p-2 text-sm">
                    </div>
                </div>

                <!-- ВЛОЖЕНИЯ ЗАДАЧИ -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Вложения задачи</label>
                    <div @dragover.prevent="isDraggingFile = true"
                         @dragleave.prevent="isDraggingFile = false"
                         @drop.prevent="handleTaskFileDrop($event)"
                         class="border-2 border-dashed rounded-xl p-4 text-center transition cursor-pointer"
                         :class="isDraggingFile ? 'border-blue-500 bg-blue-50' : 'border-gray-300 bg-gray-50'">
                        <p class="text-xs text-gray-500">Перетащите файлы сюда</p>
                        <input type="file" @change="uploadTaskFileDirect($event.target.files[0])" class="mt-2 text-xs">
                    </div>

                    <div class="mt-3 space-y-2">
                        <template x-for="file in taskAttachments" :key="file.id">
                            <div class="flex justify-between items-center p-2 bg-gray-100 rounded-lg text-xs border">
                                <div class="flex items-center gap-3 truncate">
                                    <template x-if="isImageFile(file.original_name || file.file)">
                                        <img :src="file.file" @click.stop="openImagePreview(file.file)"
                                             class="w-10 h-10 object-cover rounded border cursor-pointer hover:opacity-80 transition shrink-0">
                                    </template>
                                    <template x-if="!isImageFile(file.original_name || file.file)">
                                        <span class="text-base shrink-0">📎</span>
                                    </template>

                                    <div class="truncate">
                                        <p class="font-bold truncate" x-text="file.original_name || file.file.split('/').pop()"></p>
                                        <p class="text-[10px] text-gray-400" x-text="file.file_size_formatted"></p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-2 shrink-0">
                                    <button type="button" x-show="isImageFile(file.original_name || file.file)"
                                            @click.stop="openImagePreview(file.file)"
                                            class="text-blue-600 hover:underline">👁️ Просмотр</button>
                                    <a :href="`/api/task/attachments/${file.id}/download/`"
                                       class="text-green-600 hover:underline">📥 Скачать</a>
                                    <button type="button" @click="deleteTaskAttachment(file.id)" class="text-red-600">🗑️</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- ВКЛАДКА: ЧЕК-ЛИСТ -->
            <div x-show="activeTaskTab === 'checklist'"
                 class="space-y-4 custom-scrollbar"
                 style="height: calc(85vh - 230px); overflow-y: auto; padding-right: 0.5rem;">

                <div class="flex gap-2">
                    <input type="text" x-model="newChecklistText" placeholder="Добавить подзадачу..."
                           @keydown.enter="addChecklistItem()"
                           class="flex-1 border rounded-lg p-2 text-sm">
                    <button type="button" @click="addChecklistItem()"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">+ Добавить</button>
                </div>
                <div class="space-y-2">
                    <template x-for="item in checklistItems" :key="item.id">
                        <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg border">
                            <label class="flex items-center gap-2 text-sm cursor-pointer">
                                <input type="checkbox" :checked="item.is_completed" @change="toggleChecklistItem(item)" class="rounded">
                                <span :class="item.is_completed ? 'line-through text-gray-400' : 'text-gray-800'" x-text="item.text"></span>
                            </label>
                            <button type="button" @click="deleteChecklistItem(item.id)" class="text-red-500 hover:text-red-700">✖</button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- ВКЛАДКА: КОММЕНТАРИИ -->
            <div x-show="activeTaskTab === 'comments'"
                 class="flex flex-col space-y-3"
                 style="height: calc(85vh - 215px);">

                <!-- Список сообщений -->
                <div class="border rounded-xl p-3 bg-gray-50/50 space-y-3 custom-scrollbar"
                     style="height: calc(85vh - 410px); min-height: 120px; overflow-y: auto; padding-right: 0.5rem;">

                    <template x-for="comment in comments" :key="comment.id">
                        <div class="p-3 bg-white border rounded-xl space-y-2 shadow-xs">
                            <div class="flex justify-between items-center text-xs text-gray-500">
                                <span class="font-bold text-gray-800" x-text="comment.author"></span>
                                <span x-text="comment.created"></span>
                            </div>
                            <p x-show="comment.text" class="text-sm text-gray-700 whitespace-pre-wrap" x-text="comment.text"></p>

                            <!-- Вложения комментария-->
                            <div x-show="comment.attachments && comment.attachments.length > 0" class="pt-1 flex flex-wrap gap-2">
                                <template x-for="att in comment.attachments" :key="att.id">
                                    <div>
                                        <template x-if="isImageFile(att.original_name || att.file)">
                                            <div class="relative group cursor-pointer" @click.stop="openImagePreview(att.file)">
                                                <img :src="att.file" class="w-16 h-16 object-cover rounded-lg border hover:opacity-80 transition shadow-xs">
                                            </div>
                                        </template>
                                        <template x-if="!isImageFile(att.original_name || att.file)">
                                            <div class="text-xs text-blue-600 flex items-center gap-1 bg-white p-1.5 rounded border">
                                                📎 <a :href="`/api/comment/attachments/${att.id}/download/`" class="underline font-medium" x-text="att.original_name || 'Вложение'"></a>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <div x-show="comment.author_id === currentUserId" class="flex gap-2 justify-end text-xs pt-1 border-t border-gray-200">
                                <button type="button" @click="deleteComment(comment.id)" class="text-red-600 hover:underline">🗑️ Удалить</button>
                            </div>
                        </div>
                    </template>

                    <div x-show="comments.length === 0" class="text-center py-6 text-gray-400 text-xs">
                        Комментариев пока нет...
                    </div>
                </div>

                <!-- Форма ввода ответа -->
                <div class="border-t pt-2 bg-white shrink-0 relative">
                    <label class="block text-xs font-bold text-gray-600 mb-1">Новый комментарий</label>

                    <div x-show="showMentionDropdown"
                         @click.outside="showMentionDropdown = false"
                         class="absolute z-50 bottom-28 left-0 w-64 bg-white border rounded-xl shadow-xl max-h-48 overflow-y-auto p-1 text-xs">
                        <template x-for="user in mentionFilteredUsers" :key="user.id">
                            <div @click="insertMention(user.username)"
                                 class="p-2 hover:bg-blue-50 cursor-pointer rounded-lg font-semibold text-gray-700 flex items-center justify-between">
                                <span>👤 <span x-text="user.username"></span></span>
                                <span class="text-[10px] text-gray-400">Вставить</span>
                            </div>
                        </template>
                    </div>

                    <div @dragover.prevent="isDraggingCommentFile = true"
                         @dragleave.prevent="isDraggingCommentFile = false"
                         @drop.prevent="handleCommentFileDrop($event)"
                         class="border-2 border-dashed rounded-xl p-3 transition bg-white"
                         :class="isDraggingCommentFile ? 'border-blue-500 bg-blue-50' : 'border-gray-200'">
                        <textarea rows="2" x-model="newCommentText"
                                  @input="onCommentInput($event)"
                                  @paste="handlePaste($event, 'comment')"
                                  @keydown.ctrl.enter="addComment()"
                                  placeholder="Напишите комментарий... (@имя для упоминания)"
                                  class="w-full border-none p-1 text-sm focus:ring-0 resize-none"></textarea>

                        <div class="flex justify-between items-center mt-1 pt-2 border-t text-xs">
                            <div class="flex items-center gap-2">
                                <input type="file" @change="commentFile = $event.target.files[0]" class="text-xs">
                                <span x-show="commentFile" class="text-green-600 font-bold flex items-center gap-1">
                                    📎 <span x-text="commentFile?.name"></span>
                                    <button type="button" @click="commentFile = null" class="text-red-500 text-xs">✖</button>
                                </span>
                            </div>
                            <button type="button" @click="addComment()"
                                    class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-700">
                                Отправить
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ВКЛАДКА: ИСТОРИЯ -->
            <div x-show="activeTaskTab === 'history'"
                 class="space-y-2 custom-scrollbar"
                 style="height: calc(85vh - 230px); overflow-y: auto; padding-right: 0.5rem;">
                <template x-for="h in history" :key="h.id">
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg text-xs border">
                        <div>
                            <span class="font-bold text-gray-800" x-text="h.user_name"></span>:
                            <span class="text-gray-600" x-text="h.action"></span>
                        </div>
                        <span class="text-gray-400" x-text="h.created_at"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- 4. ФУТЕР -->
        <div class="p-4 border-t bg-gray-50 flex justify-end gap-2 shrink-0">
            <button type="button" @click="taskDetailsModal = false" class="px-4 py-2 border rounded-lg text-sm font-semibold">Отмена</button>
            <button type="button" @click="saveTask()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold">Сохранить</button>
        </div>
    </div>
</div>
