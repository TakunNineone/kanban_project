<div class="kanban-settings" x-show="showSettingsPage == true" x-transition>
    <div class="mb-6">
        <a href="#" @click.prevent="showSettingsPage = false"
           class="rounded-lg text-sm px-4 py-2 inline-flex items-center gap-1 font-bold text-white bg-gray-800 hover:bg-gray-700 transition">
            &larr; Назад к доске
        </a>
    </div>

    <div class="p-6 bg-white rounded-2xl shadow-xl border border-gray-100 max-w-5xl mx-auto space-y-6">
        <div>
            <h2 class="font-bold text-gray-800 text-2xl flex items-center gap-2">
                <i class="uil uil-setting"></i> Настройки доски
            </h2>
            <p class="text-sm text-gray-500 mt-1" x-show="settingsGroupObj">
                Группа: <span class="font-bold text-gray-800" x-text="settingsGroupObj?.name"></span>
            </p>
        </div>

        <!-- Цветовая схема -->
        <div class="p-4 bg-gray-50 rounded-xl border">
            <label class="text-gray-800 block font-bold mb-2 text-sm">Цветовая схема</label>
            <div class="flex items-center gap-3">
                <template x-for="(color, index) in colors" :key="index">
                    <div @click="colorSelected = color"
                         class="w-8 h-8 rounded-full cursor-pointer border-2 transition"
                         :class="colorSelected.value === color.value ? 'ring-2 ring-offset-2 ring-blue-600 border-white' : 'border-transparent'"
                         :style="`background: ${color.label};`"></div>
                </template>
            </div>
        </div>

        <!-- Изображение Хедера -->
        <div class="p-4 bg-gray-50 rounded-xl border">
            <label class="text-gray-800 block mb-1 font-bold text-sm">URL фонового изображения хедера</label>
            <input class="bg-white border border-gray-300 rounded-lg w-full py-2 px-3 text-sm focus:outline-none focus:border-blue-500"
                   type="url" x-model="bannerImage"
                   placeholder="https://example.com/banner.jpg">
        </div>

        <hr class="my-4">

        <!-- Управление участниками -->
        <div>
            <h3 class="font-bold text-gray-800 text-xl mb-4">Управление участниками группы</h3>

            <template x-if="!canManageSettingsGroup">
                <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-sm text-yellow-900">
                    У вас нет доступа к настройкам этой группы.
                </div>
            </template>

            <div x-show="canManageSettingsGroup" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 1. Группы пользователя -->
                <div class="border rounded-xl p-2 bg-gray-50 space-y-1">
                    <div class="font-bold text-xs text-gray-500 px-3 py-1">ГРУППЫ</div>
                    <template x-for="group in groups" :key="group.uuid">
                        <div @click="selectSettingsGroup(group)"
                             class="cursor-pointer px-3 py-2 rounded-lg text-sm flex justify-between items-center transition"
                             :class="settingsGroup === group.uuid ? 'bg-blue-600 text-white font-bold' : 'hover:bg-gray-200 text-gray-700'">
                            <span x-text="group.name"></span>
                            <span class="text-xs opacity-80" x-text="group.uuid === settingsGroup ? (settingsGroupMembers.length || 0) : ''"></span>
                        </div>
                    </template>
                    <div x-show="groups.length === 0" class="text-center py-6 text-gray-400 text-xs px-3">
                        Нет доступных групп
                    </div>
                </div>

                <!-- 2. Все пользователи -->
                <div class="border rounded-xl p-4 bg-white">
                    <template x-if="settingsGroupObj">
                        <div>
                            <div class="flex justify-between items-center mb-3 pb-2 border-b gap-2">
                                <h4 class="font-bold text-sm text-gray-800">Пользователи</h4>
                                <label x-show="isSettingsGroupOwner"
                                       class="flex items-center text-xs font-bold text-blue-600 cursor-pointer whitespace-nowrap">
                                    <input type="checkbox" class="mr-1 rounded"
                                           @change="toggleAllAvailableUsers($event.target.checked)">
                                    Выбрать всех
                                </label>
                            </div>

                            <input type="text"
                                   x-model="userSearchQuery"
                                   placeholder="Поиск пользователя..."
                                   class="w-full mb-3 rounded-lg border-gray-300 text-xs py-2 px-2 bg-gray-50 border">

                            <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                <template x-for="user in filteredAvailableUsers" :key="user.id">
                                    <label class="flex items-center text-sm p-1.5 hover:bg-gray-50 rounded cursor-pointer">
                                        <input type="checkbox"
                                               :checked="isGroupMember(user.id)"
                                               @change="toggleGroupMember(user)"
                                               :disabled="!isSettingsGroupOwner"
                                               class="mr-2.5 rounded">
                                        <span x-text="user.username" class="text-gray-700 font-medium"></span>
                                    </label>
                                </template>
                                <div x-show="filteredAvailableUsers.length === 0" class="text-center py-8 text-gray-400 text-xs">
                                    Пользователи не найдены
                                </div>
                            </div>
                        </div>
                    </template>
                    <template x-if="!settingsGroupObj">
                        <div class="text-center py-12 text-gray-400 text-xs">
                            Выберите группу слева
                        </div>
                    </template>
                </div>

                <!-- 3. Участники группы -->
                <div class="border rounded-xl p-4 bg-blue-50/50 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3 pb-2 border-b border-blue-200">
                            <h4 class="font-bold text-sm text-blue-900">Участники группы</h4>
                            <span class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-bold" x-text="settingsGroupMembers.length"></span>
                        </div>

                        <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                            <template x-for="user in settingsGroupMembers" :key="user.id">
                                <div class="flex justify-between items-center p-2 bg-white rounded-lg text-xs border border-blue-100 shadow-xs">
                                    <div class="flex items-center gap-1.5">
                                        <span>👤</span>
                                        <span class="font-bold text-gray-800" x-text="user.username"></span>
                                    </div>
                                    <button type="button"
                                            x-show="isSettingsGroupOwner"
                                            @click="removeGroupMember(user.id)"
                                            class="text-red-500 hover:text-red-700 font-bold"
                                            title="Удалить из группы">✖</button>
                                </div>
                            </template>
                            <div x-show="settingsGroupMembers.length === 0" class="text-center py-8 text-gray-400 text-xs">
                                В группе пока нет участников
                            </div>
                        </div>
                    </div>

                    <button type="button"
                            x-show="isSettingsGroupOwner"
                            class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2.5 px-4 rounded-xl shadow-md transition"
                            @click="saveGroupMembers()">
                        Сохранить состав группы
                    </button>
                    <p x-show="canManageSettingsGroup && !isSettingsGroupOwner"
                       class="mt-4 text-xs text-gray-500 text-center">
                        Изменять состав может только создатель группы
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
