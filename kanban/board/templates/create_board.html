{% extends "base.html" %}

{% block title %}Создать доску{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-lg">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Создать доску</h2>

    <form method="post" class="bg-white shadow rounded-lg p-6 border border-gray-200">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1" for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-600 text-sm mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <div class="flex gap-3 mt-6">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
                Создать
            </button>
            <a href="{% url 'board:boards' %}"
               class="text-gray-600 hover:text-gray-800 px-4 py-2">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
