{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 max-w-md">
    <div class="bg-white shadow rounded-lg p-8 border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Канбан — вход</h2>

        {% if form.errors %}
            <div class="mb-4 p-3 rounded bg-red-100 text-red-800">
                Неверное имя пользователя или пароль.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1" for="id_username">Имя пользователя</label>
                <input type="text" name="username" id="id_username" required autofocus
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-1" for="id_password">Пароль</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium">
                Войти
            </button>
        </form>

        <p class="text-center text-gray-600 mt-6">
            Нет аккаунта?
            <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800 font-medium">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
